---
name: gitlab_base.SelfReferential
description: |
  Checks for wordy, self-referential phrases.
extends: existence
message: "Rewrite '%s'. Talk directly about the feature or purpose instead."
ignorecase: true
nonword: true
vocab: false
level: warning
link: https://docs.gitlab.com/development/documentation/styleguide/language/#self-referential-writing
tokens:
  - This (document|documentation|guide|page|section|topic) (builds|contains|covers|describes|details|discusses|documents|explains|guides|introduces|lists|offers|outlines|provides|shows|walks)
